<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>码文 · Code for Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="desk-wash"></span>
    <span class="grain"></span>
  </div>

  <div class="app">
    <header class="titlebar enter">
      <button type="button" class="brand-lock" id="brandHome" data-i18n-aria="brandAria" aria-label="打开码文项目主页">
        <span class="mark" aria-hidden="true">CW</span>
        <div class="brand-text">
          <h1 data-i18n="brandName">码文</h1>
          <p class="product" data-i18n="brandTag">贴进 Word</p>
          <p class="brand-promo" data-i18n="promoTagline">高亮代码一键粘贴，格式不乱</p>
        </div>
      </button>
      <div class="titlebar-actions">
        <label class="field field-inline">
          <span data-i18n="uiLang">界面语言</span>
          <select id="uiLang" aria-label="UI language"></select>
        </label>
        <button type="button" class="btn ghost" id="btnSample" data-i18n="btnSample">示例</button>
        <button type="button" class="btn ghost" id="btnClear" data-i18n="btnClear">清空</button>
        <button type="button" class="btn ghost" id="btnDownload" data-i18n="downloadDocx">下载 DOCX</button>
        <button type="button" class="btn primary" id="btnCopy" data-i18n="btnCopy">复制到 Word</button>
      </div>
    </header>

    <section class="toolbar enter">
      <div class="toolbar-row mode-row">
        <div class="mode-switch" id="modeSwitch" role="group" aria-label="mode">
          <button type="button" class="mode-btn is-active" data-mode="code" data-i18n="modeCode">代码</button>
          <button type="button" class="mode-btn" data-mode="text" data-i18n="modeText">文本</button>
        </div>
      </div>
      <div class="toolbar-row" id="codeToolbar">
        <label class="field"><span data-i18n="langCode">语言</span>
          <select id="language" aria-label="language"></select>
        </label>
        <label class="field"><span data-i18n="font">字体</span>
          <select id="fontFamily" aria-label="font"></select>
        </label>
        <label class="field"><span data-i18n="fontSize">字号</span>
          <select id="fontSize" aria-label="font size"></select>
        </label>
        <label class="field"><span data-i18n="background">底色</span>
          <select id="background" aria-label="background"></select>
        </label>
        <label class="field"><span data-i18n="paper">纸张</span>
          <select id="paper" aria-label="paper"></select>
        </label>
        <label class="field"><span data-i18n="margin">页边距</span>
          <select id="sideMargin" aria-label="side margin"></select>
        </label>
        <label class="field"><span data-i18n="codeInset">代码边距</span>
          <select id="codeInset" aria-label="code inset"></select>
        </label>
        <label class="field"><span data-i18n="accent">标识色</span>
          <select id="accent" aria-label="marker color"></select>
        </label>
        <div class="field frame-picker" id="framePicker">
          <span data-i18n="frameStyle">边框</span>
          <button type="button" class="frame-trigger" id="btnFrame" aria-haspopup="listbox" aria-expanded="false">
            <span class="frame-trigger-thumb" id="frameThumb" data-frame="bar" aria-hidden="true"></span>
            <span id="frameLabel">左侧竖线</span>
            <span class="chev" aria-hidden="true">▾</span>
          </button>
          <div class="frame-panel" id="framePanel" role="listbox" hidden>
            <button type="button" class="frame-option" role="option" data-frame="bar" aria-selected="true">
              <span class="frame-thumb" data-frame="bar" aria-hidden="true"></span>
              <span data-i18n="frameBar">左侧竖线</span>
            </button>
            <button type="button" class="frame-option" role="option" data-frame="rails" aria-selected="false">
              <span class="frame-thumb" data-frame="rails" aria-hidden="true"></span>
              <span data-i18n="frameRails">左右竖线</span>
            </button>
            <button type="button" class="frame-option" role="option" data-frame="box" aria-selected="false">
              <span class="frame-thumb" data-frame="box" aria-hidden="true"></span>
              <span data-i18n="frameBox">四边外框</span>
            </button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="lineNumbers" checked> <span data-i18n="lineNumbers">行号</span></label>
        <label class="check"><input type="checkbox" id="rowRules" checked> <span data-i18n="rowRules">下划线</span></label>
        <label class="check"><input type="checkbox" id="forceBold"> <span data-i18n="bold">加粗</span></label>
        <label class="check"><input type="checkbox" id="forceItalic"> <span data-i18n="italic">倾斜</span></label>
        <label class="check"><input type="checkbox" id="captionEnabled"> <span data-i18n="caption">说明</span></label>
      </div>
      <div class="toolbar-row text-toolbar" id="textToolbar" hidden>
        <label class="field"><span data-i18n="numbering">编号方案</span>
          <select id="textScheme" aria-label="numbering scheme"></select>
        </label>
        <label class="field"><span data-i18n="paragraphSplitting">分段方式</span>
          <select id="textSplit" aria-label="paragraph splitting"></select>
        </label>
        <label class="field"><span data-i18n="textBodyFont">正文字体</span>
          <select id="textBodyFont" aria-label="body font"></select>
        </label>
        <label class="field"><span data-i18n="latinFontLabel">西文字体</span>
          <select id="textLatinFont" aria-label="latin font"></select>
        </label>
        <label class="field"><span data-i18n="textBodySize">正文字号</span>
          <select id="textBodySize" aria-label="body size"></select>
        </label>
        <label class="field"><span data-i18n="headingFontLabel">标题字体</span>
          <select id="textHeadingFont" aria-label="heading font"></select>
        </label>
        <label class="field"><span data-i18n="textLineSpacing">行距</span>
          <select id="textLineSpacing" aria-label="line spacing"></select>
        </label>
        <label class="field"><span data-i18n="indentLabel">首行缩进</span>
          <select id="textIndentChars" aria-label="first line indent"></select>
        </label>
        <label class="field"><span data-i18n="alignLabel">对齐</span>
          <select id="textAlign" aria-label="alignment"></select>
        </label>
        <label class="field"><span data-i18n="bodyAfterLabel">段后距</span>
          <select id="textBodyAfter" aria-label="space after paragraph"></select>
        </label>
        <label class="check"><input type="checkbox" id="textBold"> <span data-i18n="bold">加粗</span></label>
        <label class="check"><input type="checkbox" id="textItalic"> <span data-i18n="italic">倾斜</span></label>
        <label class="check"><input type="checkbox" id="textUnderline"> <span data-i18n="underline">下划线</span></label>
      </div>
      <div class="controls-row translate-row" id="translateRow" hidden>
        <div class="translate-toolbar">
          <label class="field">
            <span data-i18n="translateProviderLabel">翻译</span>
            <select id="translateProvider" aria-label="translation provider"></select>
          </label>
          <label class="field">
            <span data-i18n="directionLabel">方向</span>
            <select id="translateDirection" aria-label="translation direction"></select>
          </label>
          <label class="field">
            <span data-i18n="translateOutputLabel">输出</span>
            <select id="translateOutput" aria-label="translation output"></select>
          </label>
          <label class="check"><input type="checkbox" id="autoTranslate"> <span data-i18n="autoTranslateLabel">自动翻译</span></label>
          <div class="caption-row-btns translate-btns">
            <button type="button" class="btn ghost" id="btnAiSettings" data-i18n="aiSettings">AI 设置</button>
            <button type="button" class="btn primary" id="btnTranslate" data-i18n="btnTranslate" disabled>翻译</button>
          </div>
        </div>
      </div>
      <div class="controls-row ai-row" id="aiPanel" hidden>
        <label class="field">
          <span data-i18n="aiPreset">服务商</span>
          <select id="aiPreset" aria-label="AI provider preset"></select>
        </label>
        <label class="field">
          <span data-i18n="aiBaseUrl">接口地址</span>
          <input type="text" id="aiBaseUrl" placeholder="https://open.bigmodel.cn/api/paas/v4" autocomplete="off">
        </label>
        <label class="field">
          <span data-i18n="aiModel">模型</span>
          <input type="text" id="aiModel" placeholder="glm-4-flash" autocomplete="off">
        </label>
        <label class="field">
          <span data-i18n="aiApiKey">API Key</span>
          <input type="password" id="aiApiKey" placeholder="sk-…" autocomplete="off">
        </label>
        <button type="button" class="btn ghost" id="btnAiSave" data-i18n="aiSave">保存</button>
      </div>
      <div class="controls-row caption-row" id="captionRow" hidden>
        <div class="caption-toolbar">
          <label class="field">
            <span data-i18n="captionFont">说明字体</span>
            <select id="captionFont" aria-label="caption font"></select>
          </label>
          <label class="field">
            <span data-i18n="captionColor">说明颜色</span>
            <select id="captionColor" aria-label="caption color"></select>
          </label>
          <label class="field">
            <span data-i18n="captionBg">说明底色</span>
            <select id="captionBg" aria-label="caption background"></select>
          </label>
          <label class="check"><input type="checkbox" id="captionBold"> <span data-i18n="captionBold">加粗</span></label>
          <label class="check"><input type="checkbox" id="captionItalic"> <span data-i18n="captionItalic">倾斜</span></label>
          <div class="caption-row-btns">
            <button type="button" class="btn ghost caption-btn" id="captionAddRow" data-i18n="captionAdd">加一栏</button>
            <button type="button" class="btn ghost caption-btn" id="captionRemoveRow" data-i18n="captionRemove">减一栏</button>
          </div>
        </div>
        <div class="caption-lines" id="captionLines"></div>
      </div>
    </section>

    <main class="workspace enter">
      <section class="panel">
        <div class="panel-head">
          <strong id="sourceLabel" data-i18n="source">源代码</strong>
          <span class="panel-head-right source-head-tools">
            <div class="source-find" role="search">
              <input
                type="search"
                id="sourceFind"
                class="source-find-input"
                data-i18n-placeholder="sourceFindPlaceholder"
                placeholder="搜索代码…"
                autocomplete="off"
                spellcheck="false"
              />
              <span id="sourceFindMeta" class="source-find-meta" aria-live="polite"></span>
              <button type="button" class="source-find-btn" id="sourceFindPrev" data-i18n-aria="sourceFindPrev" aria-label="上一处" title="">↑</button>
              <button type="button" class="source-find-btn" id="sourceFindNext" data-i18n-aria="sourceFindNext" aria-label="下一处" title="">↓</button>
            </div>
            <span id="metaSource" class="meta">源代码</span>
          </span>
        </div>
        <textarea id="source" spellcheck="false" data-i18n-placeholder="placeholder" placeholder="在此粘贴代码…"></textarea>
      </section>
      <section class="panel preview-panel">
        <div class="panel-head">
          <strong data-i18n="preview">Word 预览</strong>
          <span class="panel-head-right">
            <span class="preview-jump-hint" data-i18n="previewJumpHint">悬停高亮 · 双击跳到源码</span>
            <span id="metaPreview" class="meta">预览</span>
          </span>
        </div>
        <div class="preview-stage">
          <button type="button" class="preview-expand" id="previewExpand" data-i18n-aria="previewExpand" aria-label="Expand preview" title="">
            <span class="preview-expand-glyph" aria-hidden="true">
              <svg class="preview-expand-icon" width="15" height="15" viewBox="0 0 16 16" focusable="false">
                <path fill="currentColor" d="M2.5 2.5h4.2v1.4H3.9v2.8H2.5V2.5zm6.8 0h4.2v4.2h-1.4V3.9H9.3V2.5zM2.5 9.3h1.4v2.8h2.8v1.4H2.5V9.3zm9.6 0h1.4v4.2H9.3v-1.4h2.8V9.3z"/>
              </svg>
            </span>
            <span class="preview-expand-label" data-i18n="previewExpandShort">放大</span>
          </button>
          <div class="preview-wrap" id="preview" data-mode="light"></div>
        </div>
      </section>
    </main>

    <dialog class="preview-lightbox" id="previewLightbox" aria-modal="true">
      <div class="preview-lightbox-chrome">
        <button type="button" class="preview-lightbox-close" id="previewLightboxClose" data-i18n-aria="previewClose" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
        <div class="preview-lightbox-scroll" id="previewLightboxBody"></div>
        <p class="preview-jump-hint preview-jump-hint--lightbox" data-i18n="previewJumpHint">悬停高亮 · 双击跳到源码</p>
      </div>
    </dialog>

    <dialog class="jump-confirm" id="jumpConfirm" aria-modal="true">
      <form method="dialog" class="jump-confirm-card">
        <p class="jump-confirm-title" id="jumpConfirmTitle"></p>
        <p class="jump-confirm-body" id="jumpConfirmBody" data-i18n="jumpConfirmBody">Jump to this line in the source editor?</p>
        <div class="jump-confirm-actions">
          <button type="submit" value="cancel" class="btn ghost" data-i18n="jumpConfirmNo">Cancel</button>
          <button type="submit" value="ok" class="btn primary" data-i18n="jumpConfirmYes">Go to source</button>
        </div>
      </form>
    </dialog>

    <footer class="statusbar enter">
      <p class="status" id="status" role="status"></p>
      <div class="foot-links">
        <button type="button" class="foot-github" id="btnGitHub" data-i18n-aria="promoGitHub">
          <span class="foot-github-label" data-i18n="promoGitHub">GitHub</span>
          <span class="foot-star" aria-hidden="true">★</span>
          <span class="foot-star-hint" data-i18n="promoStar">点个 Star</span>
        </button>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
